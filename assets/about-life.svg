<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <style><![CDATA[
      @font-face { font-family: 'Display'; src: url(data:font/woff2;base64,d09GMgABAAAAA...); format('woff2'); }
      @font-face { font-family: 'Mono'; src: url(data:font/woff2;base64,d09GMgABAAAAA...); format('woff2'); }
      .bg { fill: #070b16; }
      .text-main { fill: #f0f4fa; font-family: 'Display', sans-serif; }
      .text-accent { fill: #247bff; }
      .text-crimson { fill: #ff354f; }
      .text-muted { fill: #6b7c9a; font-family: 'Mono', monospace; font-size: 13px; }
      .card { fill: #0d1422; stroke: #1e2a3e; stroke-width: 1; rx: 16; }
      .card:hover { stroke: #247bff; }
      .section-title { font-size: 28px; font-weight: 700; }
      .capability { font-size: 16px; font-weight: 500; }
      .capability-desc { font-size: 13px; opacity: 0.7; font-family: 'Mono', monospace; }
      .dot-pattern { fill: url(#dots); }
      #dots { width: 4px; height: 4px; }
    ]]></style>
    <pattern id="dots" patternUnits="userSpaceOnUse" width="20" height="20">
      <circle cx="2" cy="2" r="1" fill="#247bff" opacity="0.06"/>
    </pattern>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#247bff"/>
      <stop offset="100%" stop-color="#ff354f"/>
    </linearGradient>
  </defs>
  <rect class="bg" width="1200" height="500"/>
  <rect class="dot-pattern" width="1200" height="500"/>
  
  <!-- Left: Capabilities -->
  <g transform="translate(60, 60)">
    <text class="section-title text-main">what i do</text>
    <line x1="0" y1="40" x2="120" y2="40" stroke="url(#borderGrad)" stroke-width="3"/>
    
    <g transform="translate(0, 70)">
      <!-- Capability 1 -->
      <rect class="card" width="480" height="110" x="0" y="0"/>
      <text x="20" y="35" class="capability text-accent">Creative Direction & Brand</text>
      <text x="20" y="60" class="capability-desc text-muted">Turning complex tech into visual stories people actually understand and share</text>
      <text x="20" y="85" class="capability-desc text-crimson">▸ Positioning  ▸ Visual Identity  ▸ Founder-Led Content</text>
      
      <!-- Capability 2 -->
      <rect class="card" width="480" height="110" x="0" y="130"/>
      <text x="20" y="165" class="capability text-accent">AI-Native Content Systems</text>
      <text x="20" y="190" class="capability-desc text-muted">Building products that understand the full creative workflow — idea to publish</text>
      <text x="20" y="215" class="capability-desc text-crimson">▸ ReelNinja Studio  ▸ Trend → Script → Edit → Publish</text>
      
      <!-- Capability 3 -->
      <rect class="card" width="480" height="110" x="0" y="260"/>
      <text x="20" y="295" class="capability text-accent">Growth & Marketing Strategy</text>
      <text x="20" y="320" class="capability-desc text-muted">Distribution, audience building, and making technology culturally relevant</text>
      <text x="20" y="345" class="capability-desc text-crimson">▸ Product Storytelling  ▸ Community  ▸ Launch Strategy</text>
    </g>
  </g>
  
  <!-- Right: Interests Carousel -->
  <g transform="translate(600, 60)">
    <text class="section-title text-main">what i'm into</text>
    <line x1="0" y1="40" x2="120" y2="40" stroke="url(#borderGrad)" stroke-width="3"/>
    
    <!-- Slide 1 -->
    <g class="slide" transform="translate(0, 70)">
      <rect class="card" width="520" height="340" x="0" y="0"/>
      <text x="30" y="60" class="capability text-crimson">🎬 AI Video & Creative Tools</text>
      <text x="30" y="95" class="capability-desc text-muted">Obsessed with tools that collapse production time without killing taste. ReelNinja, Sora, Runway, custom pipelines — if it makes video faster, I'm testing it.</text>
      <text x="30" y="140" class="capability text-accent">Currently exploring:</text>
      <text x="30" y="170" class="capability-desc text-muted">▸ Motion graphics automation  ▸ AI sound design  ▸ Real-time B-roll</text>
      <text x="30" y="210" class="capability-desc text-muted">▸ Caption/style transfer  ▸ Editor-in-the-loop workflows</text>
      
      <!-- Progress bar -->
      <rect x="30" y="260" width="460" height="6" rx="3" fill="#1e2a3e"/>
      <rect x="30" y="260" width="460" height="6" rx="3" fill="url(#borderGrad)">
        <animate attributeName="width" from="0" to="460" dur="4s" fill="freeze"/>
      </rect>
      <text x="30" y="285" class="text-muted" font-size="11">Slide 1 of 3 · Auto-advances every 4s</text>
    </g>
    
    <!-- Slide 2 -->
    <g class="slide" transform="translate(0, 70)" opacity="0">
      <rect class="card" width="520" height="340" x="0" y="0"/>
      <text x="30" y="60" class="capability text-crimson">🚀 Startups & Building in Public</text>
      <text x="30" y="95" class="capability-desc text-muted">Co-founded InfluenzO (NVIDIA Inception, IIT Delhi Blueprint, 2 govt grants). Love the messy middle — the pivots, the 2am decisions, the user feedback that changes everything.</text>
      <text x="30" y="150" class="capability text-accent">Focus areas:</text>
      <text x="30" y="180" class="capability-desc text-muted">▸ Founder-led brand  ▸ DeepTech commercialization  ▸ MeitY GENESIS</text>
      <text x="30" y="210" class="capability-desc text-muted">▸ Punjab ecosystem  ▸ Content-first growth  ▸ Community moats</text>
      <rect x="30" y="260" width="460" height="6" rx="3" fill="#1e2a3e"/>
      <rect x="30" y="260" width="0" height="6" rx="3" fill="url(#borderGrad)">
        <animate attributeName="width" from="0" to="460" begin="4s" dur="4s" fill="freeze"/>
      </rect>
      <text x="30" y="285" class="text-muted" font-size="11">Slide 2 of 3</text>
    </g>
    
    <!-- Slide 3 -->
    <g class="slide" transform="translate(0, 70)" opacity="0">
      <rect class="card" width="520" height="340" x="0" y="0"/>
      <text x="30" y="60" class="capability text-crimson">🎨 Internet Culture & Creative Experiments</text>
      <text x="30" y="95" class="capability-desc text-muted">The internet is the best focus group. I study memes, formats, subcultures — not to chase trends, but to understand what makes people *feel* something. Then I build for that.</text>
      <text x="30" y="150" class="capability text-accent">Recent rabbit holes:</text>
      <text x="30" y="180" class="capability-desc text-muted">▸ Lo-fi UI aesthetics  ▸ Generative art as brand  ▸ Discord-native communities</text>
      <text x="30" y="210" class="capability-desc text-muted">▸ AI-generated merch  ▸ Video-first personal brands</text>
      <rect x="30" y="260" width="460" height="6" rx="3" fill="#1e2a3e"/>
      <rect x="30" y="260" width="0" height="6" rx="3" fill="url(#borderGrad)">
        <animate attributeName="width" from="0" to="460" begin="8s" dur="4s" fill="freeze"/>
      </rect>
      <text x="30" y="285" class="text-muted" font-size="11">Slide 3 of 3</text>
    </g>
  </g>
</svg>