<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <style><![CDATA[
      @font-face { font-family: 'Display'; src: url(data:font/woff2;base64,d09GMgABAAAAA...); format('woff2'); }
      @font-face { font-family: 'Mono'; src: url(data:font/woff2;base64,d09GMgABAAAAA...); format('woff2'); }
      .bg { fill: #070b16; }
      .text-main { fill: #f0f4fa; font-family: 'Display', sans-serif; }
      .text-accent { fill: #247bff; }
      .text-crimson { fill: #ff354f; }
      .text-muted { fill: #6b7c9a; font-family: 'Mono', monospace; font-size: 14px; }
      .role { font-size: 28px; font-weight: 600; }
      .name { font-size: 72px; font-weight: 800; letter-spacing: -2px; }
      .pitch { font-size: 22px; font-weight: 400; opacity: 0.9; }
      .location { font-size: 16px; opacity: 0.7; }
      .dot-pattern { fill: url(#dots); }
      #dots { width: 4px; height: 4px; }
    ]]></style>
    <pattern id="dots" patternUnits="userSpaceOnUse" width="20" height="20">
      <circle cx="2" cy="2" r="1" fill="#247bff" opacity="0.08"/>
    </pattern>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0f4fa"/>
      <stop offset="50%" stop-color="#247bff"/>
      <stop offset="100%" stop-color="#ff354f"/>
    </linearGradient>
  </defs>
  <rect class="bg" width="1200" height="600"/>
  <rect class="dot-pattern" width="1200" height="600"/>
  
  <!-- Portrait - REAL IMAGE -->
  <g transform="translate(880, 80)">
    <image href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA5MAAAOTCAYAAAAi71eJAAAgAElEQVR4Xuy9ibbkupEkyLhrLnraSqqZL5hz+g+mVKd7pJrunv//..." width="240" height="240" preserveAspectRatio="xMidYMid slice"/>
    <rect x="0" y="0" width="240" height="240" rx="20" fill="none" stroke="#247bff" stroke-width="2"/>
  </g>
  
  <!-- Greeting -->
  <text x="80" y="100" class="text-main" font-size="20" opacity="0.6">hey, i'm</text>
  
  <!-- Name with gradient -->
  <text x="80" y="180" class="name" fill="url(#nameGrad)">Hux</text>
  <text x="80" y="210" class="text-main" font-size="18" opacity="0.5">Harsh Sharma</text>
  
  <!-- Cycling roles -->
  <g transform="translate(80, 260)">
    <text class="role text-main">CMO & Co-Founder</text>
    <text class="role text-accent" x="0" y="40" opacity="0">Creative Director</text>
    <text class="role text-crimson" x="0" y="80" opacity="0">AI Product Builder</text>
    <text class="role text-main" x="0" y="120" opacity="0">Content Systems Architect</text>
  </g>
  
  <!-- Pitch -->
  <text x="80" y="420" class="pitch text-main">I build, market, experiment, and talk way too much about AI, content, startups, and creative ideas.</text>
  
  <!-- Location/Company -->
  <g transform="translate(80, 470)" font-family="Mono, monospace" font-size="14">
    <text class="text-muted">📍 Chandigarh, India</text>
    <text class="text-muted" x="0" y="24">🏢 InfluenzO Technologies</text>
    <text class="text-muted" x="0" y="48">🌐 influenzo.io</text>
  </g>
  
  <!-- Border accent -->
  <line x1="80" y1="520" x2="400" y2="520" stroke="#247bff" stroke-width="2" stroke-dasharray="4 8" opacity="0.5"/>
  <line x1="80" y1="520" x2="200" y2="520" stroke="#ff354f" stroke-width="2"/>
</svg>