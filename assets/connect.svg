<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
  <defs>
    <style><![CDATA[
      @font-face { font-family: 'Display'; src: url(data:font/woff2;base64,d09GMgABAAAAA...); format('woff2'); }
      @font-face { font-family: 'Mono'; src: url(data:font/woff2;base64,d09GMgABAAAAA...); format('woff2'); }
      .bg { fill: #070b16; }
      .text-main { fill: #f0f4fa; font-family: 'Display', sans-serif; }
      .text-accent { fill: #247bff; }
      .text-crimson { fill: #ff354f; }
      .text-muted { fill: #6b7c9a; font-family: 'Mono', monospace; font-size: 13px; }
      .card { fill: #0d1422; stroke: #1e2a3e; stroke-width: 1; rx: 16; }
      .card:hover { stroke: #247bff; transform: translateX(4px); }
      .icon-bg { fill: #111827; rx: 10; }
      .section-title { font-size: 26px; font-weight: 700; }
      .dot-pattern { fill: url(#dots); }
      #dots { width: 4px; height: 4px; }
    ]]></style>
    <pattern id="dots" patternUnits="userSpaceOnUse" width="20" height="20">
      <circle cx="2" cy="2" r="1" fill="#247bff" opacity="0.06"/>
    </pattern>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#247bff"/>
      <stop offset="100%" stop-color="#ff354f"/>
    </linearGradient>
    <linearGradient id="cardBorder1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#247bff"/>
      <stop offset="100%" stop-color="#00d4aa"/>
    </linearGradient>
    <linearGradient id="cardBorder2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff354f"/>
      <stop offset="100%" stop-color="#247bff"/>
    </linearGradient>
    <linearGradient id="cardBorder3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#ff354f"/>
    </linearGradient>
  </defs>
  <rect class="bg" width="1000" height="400"/>
  <rect class="dot-pattern" width="1000" height="400"/>
  
  <!-- Left: Pointing Character - REAL IMAGE -->
  <g transform="translate(40, 20)">
    <image href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA5MAAAOTCAYAAAAi71eJAAAgAElEQVR4Xuy9ibbkupEkyLhrLnraSqqZL5hz+g+mVKd7pJrunv//..." width="320" height="360" preserveAspectRatio="xMidYMid slice"/>
    <rect x="0" y="0" width="320" height="360" rx="20" fill="none" stroke="#ff354f" stroke-width="2"/>
  </g>
  
  <!-- Right: Social Cards -->
  <g transform="translate(400, 30)">
    <text class="section-title text-main">connect</text>
    <line x1="0" y1="40" x2="100" y2="40" stroke="url(#arrowGrad)" stroke-width="3"/>
    
    <!-- LinkedIn Card -->
    <g transform="translate(0, 70)">
      <a href="https://www.linkedin.com/in/harshsharma0409" target="_blank">
        <rect class="card" width="540" height="90" x="0" y="0" 
              stroke="url(#cardBorder1)" stroke-width="1.5">
          <animate attributeName="stroke-width" values="1.5;2.5;1.5" dur="3s" repeatCount="indefinite"/>
        </rect>
      </a>
      <rect class="icon-bg" x="20" y="15" width="60" height="60"/>
      <text x="50" y="57" text-anchor="middle" font-size="28" fill="#0077b5">in</text>
      <text x="100" y="40" class="text-main" font-size="18" font-weight="600">LinkedIn</text>
      <text x="100" y="65" class="text-muted" font-size="12">/in/harshsharma0409</text>
      <!-- Nudge arrow -->
      <g transform="translate(490, 30)">
        <path d="M 0 0 L 15 -8 L 15 8 Z" fill="url(#cardBorder1)" opacity="0.7">
          <animate attributeName="transform" 
                   type="translate" 
                   values="0,0; 8,0; 0,0" 
                   dur="2s" 
                   repeatCount="indefinite"/>
        </path>
      </g>
    </g>
    
    <!-- Website Card -->
    <g transform="translate(0, 180)">
      <a href="https://influenzo.io" target="_blank">
        <rect class="card" width="540" height="90" x="0" y="0" 
              stroke="url(#cardBorder2)" stroke-width="1.5">
          <animate attributeName="stroke-width" values="1.5;2.5;1.5" dur="3s" begin="0.5s" repeatCount="indefinite"/>
        </rect>
      </a>
      <rect class="icon-bg" x="20" y="195" width="60" height="60"/>
      <text x="50" y="237" text-anchor="middle" font-size="24" fill="#247bff">🌐</text>
      <text x="100" y="220" class="text-main" font-size="18" font-weight="600">InfluenzO</text>
      <text x="100" y="245" class="text-muted" font-size="12">influenzo.io</text>
      <g transform="translate(490, 210)">
        <path d="M 0 0 L 15 -8 L 15 8 Z" fill="url(#cardBorder2)" opacity="0.7">
          <animate attributeName="transform" 
                   type="translate" 
                   values="0,0; 8,0; 0,0" 
                   dur="2s" 
                   begin="0.5s"
                   repeatCount="indefinite"/>
        </path>
      </g>
    </g>
    
    <!-- GitHub Card -->
    <g transform="translate(0, 290)">
      <a href="https://github.com/harshsp4" target="_blank">
        <rect class="card" width="540" height="90" x="0" y="0" 
              stroke="url(#cardBorder3)" stroke-width="1.5">
          <animate attributeName="stroke-width" values="1.5;2.5;1.5" dur="3s" begin="1s" repeatCount="indefinite"/>
        </rect>
      </a>
      <rect class="icon-bg" x="20" y="305" width="60" height="60"/>
      <text x="50" y="347" text-anchor="middle" font-size="28" fill="#f0f4fa">⌘</text>
      <text x="100" y="330" class="text-main" font-size="18" font-weight="600">GitHub</text>
      <text x="100" y="355" class="text-muted" font-size="12">/harshsp4</text>
      <g transform="translate(490, 320)">
        <path d="M 0 0 L 15 -8 L 15 8 Z" fill="url(#cardBorder3)" opacity="0.7">
          <animate attributeName="transform" 
                   type="translate" 
                   values="0,0; 8,0; 0,0" 
                   dur="2s" 
                   begin="1s"
                   repeatCount="indefinite"/>
        </path>
      </g>
    </g>
  </g>
  
  <!-- Reduced motion -->
  <style>
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .card:hover { transform: none; }
    }
  </style>
</svg>