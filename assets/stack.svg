<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <style><![CDATA[
      @font-face { font-family: 'Display'; src: url(data:font/woff2;base64,d09GMgABAAAAA...); format('woff2'); }
      @font-face { font-family: 'Mono'; src: url(data:font/woff2;base64,d09GMgABAAAAA...); format('woff2'); }
      .bg { fill: #070b16; }
      .text-main { fill: #f0f4fa; font-family: 'Display', sans-serif; }
      .text-accent { fill: #247bff; }
      .text-crimson { fill: #ff354f; }
      .text-muted { fill: #6b7c9a; font-family: 'Mono', monospace; font-size: 12px; }
      .chip { fill: #0d1422; stroke: #1e2a3e; stroke-width: 1; rx: 10; }
      .chip:hover { stroke: #247bff; cursor: pointer; }
      .chip-text { font-family: 'Mono', monospace; font-size: 12px; font-weight: 500; }
      .section-title { font-size: 28px; font-weight: 700; }
      .dot-pattern { fill: url(#dots); }
      #dots { width: 4px; height: 4px; }
    ]]></style>
    <pattern id="dots" patternUnits="userSpaceOnUse" width="20" height="20">
      <circle cx="2" cy="2" r="1" fill="#247bff" opacity="0.06"/>
    </pattern>
    <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff"/>
      <stop offset="100%" stop-color="#ff354f"/>
    </linearGradient>
    <linearGradient id="orbitGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff354f"/>
      <stop offset="100%" stop-color="#247bff"/>
    </linearGradient>
    <linearGradient id="orbitGrad3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#247bff"/>
      <stop offset="100%" stop-color="#00d4aa"/>
    </linearGradient>
  </defs>
  <rect class="bg" width="1200" height="500"/>
  <rect class="dot-pattern" width="1200" height="500"/>
  
  <!-- Title -->
  <text x="60" y="60" class="section-title text-main">tech stack</text>
  <line x1="60" y1="75" x2="180" y2="75" stroke="url(#orbitGrad1)" stroke-width="3"/>
  
  <!-- Three tilted elliptical orbits -->
  <g transform="translate(600, 200)">
    <!-- Orbit 1: AI/ML (Blue) - Horizontal ellipse tilted -->
    <ellipse cx="0" cy="0" rx="220" ry="80" fill="none" stroke="url(#orbitGrad1)" stroke-width="1.5" opacity="0.4" transform="rotate(-15)"/>
    <!-- Orbit 2: Video/Creative (Crimson) - Vertical ellipse tilted -->
    <ellipse cx="0" cy="0" rx="160" ry="140" fill="none" stroke="url(#orbitGrad2)" stroke-width="1.5" opacity="0.4" transform="rotate(25)"/>
    <!-- Orbit 3: Web/Infra (Teal) - Wider ellipse -->
    <ellipse cx="0" cy="0" rx="280" ry="50" fill="none" stroke="url(#orbitGrad3)" stroke-width="1.5" opacity="0.4" transform="rotate(-35)"/>
    
    <!-- Orbit 1 icons: AI/ML -->
    <g class="orbit-group" transform="rotate(-15)">
      <g transform="translate(220, 0)">
        <rect class="chip" x="-45" y="-18" width="90" height="36"/>
        <text class="chip-text text-main" x="0" y="5" text-anchor="middle">PyTorch</text>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="20s" repeatCount="indefinite"/>
      </g>
      <g transform="translate(-110, 70)">
        <rect class="chip" x="-45" y="-18" width="90" height="36"/>
        <text class="chip-text text-main" x="0" y="5" text-anchor="middle">Transformers</text>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="20s" repeatCount="indefinite"/>
      </g>
      <g transform="translate(-180, -60)">
        <rect class="chip" x="-40" y="-18" width="80" height="36"/>
        <text class="chip-text text-main" x="0" y="5" text-anchor="middle">OpenAI</text>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="20s" repeatCount="indefinite"/>
      </g>
      <g transform="translate(100, -100)">
        <rect class="chip" x="-45" y="-18" width="90" height="36"/>
        <text class="chip-text text-main" x="0" y="5" text-anchor="middle">LangChain</text>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="20s" repeatCount="indefinite"/>
      </g>
      <g transform="translate(180, 50)">
        <rect class="chip" x="-40" y="-18" width="80" height="36"/>
        <text class="chip-text text-main" x="0" y="5" text-anchor="middle">Whisper</text>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="20s" repeatCount="indefinite"/>
      </g>
    </g>
    
    <!-- Orbit 2 icons: Video/Creative -->
    <g class="orbit-group" transform="rotate(25)">
      <g transform="translate(0, -140)">
        <rect class="chip" x="-45" y="-18" width="90" height="36"/>
        <text class="chip-text text-main" x="0" y="5" text-anchor="middle">FFmpeg</text>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="25s" repeatCount="indefinite"/>
      </g>
      <g transform="translate(110, -70)">
        <rect class="chip" x="-50" y="-18" width="100" height="36"/>
        <text class="chip-text text-main" x="0" y="5" text-anchor="middle">Runway Gen-3</text>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="25s" repeatCount="indefinite"/>
      </g>
      <g transform="translate(-110, 70)">
        <rect class="chip" x="-40" y="-18" width="80" height="36"/>
        <text class="chip-text text-main" x="0" y="5" text-anchor="middle">Sora</text>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="25s" repeatCount="indefinite"/>
      </g>
      <g transform="translate(50, 120)">
        <rect class="chip" x="-45" y="-18" width="90" height="36"/>
        <text class="chip-text text-main" x="0" y="5" text-anchor="middle">Davinci</text>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="25s" repeatCount="indefinite"/>
      </g>
      <g transform="translate(-160, -20)">
        <rect class="chip" x="-45" y="-18" width="90" height="36"/>
        <text class="chip-text text-main" x="0" y="5" text-anchor="middle">After Effects</text>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="25s" repeatCount="indefinite"/>
      </g>
    </g>
    
    <!-- Orbit 3 icons: Web/Infra -->
    <g class="orbit-group" transform="rotate(-35)">
      <g transform="translate(280, 0)">
        <rect class="chip" x="-35" y="-18" width="70" height="36"/>
        <text class="chip-text text-main" x="0" y="5" text-anchor="middle">Next.js</text>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="30s" repeatCount="indefinite"/>
      </g>
      <g transform="translate(-200, 40)">
        <rect class="chip" x="-30" y="-18" width="60" height="36"/>
        <text class="chip-text text-main" x="0" y="5" text-anchor="middle">Vercel</text>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="30s" repeatCount="indefinite"/>
      </g>
      <g transform="translate(-250, -30)">
        <rect class="chip" x="-35" y="-18" width="70" height="36"/>
        <text class="chip-text text-main" x="0" y="5" text-anchor="middle">Docker</text>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="30s" repeatCount="indefinite"/>
      </g>
      <g transform="translate(150, -60)">
        <rect class="chip" x="-35" y="-18" width="70" height="36"/>
        <text class="chip-text text-main" x="0" y="5" text-anchor="middle">Postgres</text>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="30s" repeatCount="indefinite"/>
      </g>
      <g transform="translate(100, 70)">
        <rect class="chip" x="-35" y="-18" width="70" height="36"/>
        <text class="chip-text text-main" x="0" y="5" text-anchor="middle">Redis</text>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="30s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>
  
  <!-- Stack chips at bottom -->
  <g transform="translate(60, 380)">
    <text class="text-muted" font-size="13">Core:</text>
    <g transform="translate(0, 20)">
      <rect class="chip" x="0" y="0" width="90" height="32"/>
      <text class="chip-text text-accent" x="45" y="20" text-anchor="middle">Python</text>
      <rect class="chip" x="100" y="0" width="90" height="32"/>
      <text class="chip-text text-accent" x="145" y="20" text-anchor="middle">TypeScript</text>
      <rect class="chip" x="200" y="0" width="70" height="32"/>
      <text class="chip-text text-accent" x="235" y="20" text-anchor="middle">Rust</text>
      <rect class="chip" x="280" y="0" width="90" height="32"/>
      <text class="chip-text text-accent" x="325" y="20" text-anchor="middle">Node.js</text>
    </g>
    <text class="text-muted" x="0" y="70" font-size="13">Cloud & Infra:</text>
    <g transform="translate(0, 90)">
      <rect class="chip" x="0" y="0" width="80" height="32"/>
      <text class="chip-text text-crimson" x="40" y="20" text-anchor="middle">AWS</text>
      <rect class="chip" x="90" y="0" width="80" height="32"/>
      <text class="chip-text text-crimson" x="130" y="20" text-anchor="middle">GCP</text>
      <rect class="chip" x="180" y="0" width="100" height="32"/>
      <text class="chip-text text-crimson" x="230" y="20" text-anchor="middle">Kubernetes</text>
      <rect class="chip" x="290" y="0" width="100" height="32"/>
      <text class="chip-text text-crimson" x="340" y="20" text-anchor="middle">Terraform</text>
    </g>
    <text class="text-muted" x="0" y="140" font-size="13">Creative:</text>
    <g transform="translate(0, 160)">
      <rect class="chip" x="0" y="0" width="100" height="32"/>
      <text class="chip-text text-main" x="50" y="20" text-anchor="middle">Figma</text>
      <rect class="chip" x="110" y="0" width="120" height="32"/>
      <text class="chip-text text-main" x="170" y="20" text-anchor="middle">After Effects</text>
      <rect class="chip" x="240" y="0" width="100" height="32"/>
      <text class="chip-text text-main" x="290" y="20" text-anchor="middle">Blender</text>
    </g>
  </g>
</svg>