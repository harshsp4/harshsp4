<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" width="400" height="550">
  <defs>
    <style><![CDATA[
      @font-face { font-family: 'Display'; src: url(data:font/woff2;base64,d09GMgABAAAAA...); format('woff2'); }
      @font-face { font-family: 'Mono'; src: url(data:font/woff2;base64,d09GMgABAAAAA...); format('woff2'); }
      .bg { fill: #070b16; }
      .text-main { fill: #f0f4fa; font-family: 'Display', sans-serif; }
      .text-accent { fill: #247bff; }
      .text-crimson { fill: #ff354f; }
      .text-muted { fill: #6b7c9a; font-family: 'Mono', monospace; font-size: 11px; }
      .lanyard { fill: none; stroke: #1a1f2e; stroke-width: 6; stroke-linecap: round; }
      .clasp { fill: #c9b896; }
      .card-bg { fill: #0d1422; stroke: #1e2a3e; stroke-width: 1.5; rx: 12; }
      .barcode-line { fill: #1a1f2e; }
      .foil { fill: url(#foilGrad); }
      .dot-pattern { fill: url(#dots); }
      #dots { width: 4px; height: 4px; }
    ]]></style>
    <pattern id="dots" patternUnits="userSpaceOnUse" width="15" height="15">
      <circle cx="1" cy="1" r="0.5" fill="#247bff" opacity="0.08"/>
    </pattern>
    <linearGradient id="foilGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9b896"/>
      <stop offset="30%" stop-color="#f0e6d2"/>
      <stop offset="50%" stop-color="#fff8f0" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#f0e6d2"/>
      <stop offset="100%" stop-color="#c9b896"/>
    </linearGradient>
    <linearGradient id="lightSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="-50%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="0%" stop-color="rgba(255,255,255,0.3)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <radialGradient id="metalGrad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#e8dcc8"/>
      <stop offset="50%" stop-color="#c9b896"/>
      <stop offset="100%" stop-color="#8b7d5c"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect class="bg" width="400" height="550"/>
  <rect class="dot-pattern" width="400" height="550"/>
  
  <!-- Main group for pendulum animation -->
  <g id="idCard" transform="translate(200, 100)">
    <!-- Lanyard cord (two strands) -->
    <path class="lanyard" d="M -60 -120 Q -30 -60, 0 0 M 60 -120 Q 30 -60, 0 0" 
          stroke-dasharray="8 4" opacity="0.6"/>
    
    <!-- Metal clasp -->
    <g transform="translate(0, -130)">
      <ellipse class="clasp" cx="0" cy="0" rx="18" ry="10" fill="url(#metalGrad)"/>
      <ellipse cx="0" cy="0" rx="10" ry="5" fill="#070b16"/>
      <!-- Clasp hinge -->
      <rect x="-2" y="-12" width="4" height="8" fill="#8b7d5c"/>
    </g>
    
    <!-- ID Card body -->
    <g id="cardBody">
      <!-- Card background with subtle gradient border -->
      <rect class="card-bg" x="-120" y="-80" width="240" height="360" 
            stroke="url(#foilGrad)" stroke-width="1"/>
      
      <!-- Top foil strip -->
      <rect class="foil" x="-120" y="-80" width="240" height="6" rx="12 12 0 0"/>
      
      <!-- Portrait placeholder -->
      <g transform="translate(-120, -70)">
        <rect x="10" y="10" width="140" height="140" rx="8" fill="#111827" stroke="#247bff" stroke-width="1.5" stroke-dasharray="6 3"/>
        <text x="80" y="85" text-anchor="middle" font-family="Mono, monospace" font-size="11" fill="#6b7c9a">id.png</text>
        <text x="80" y="100" text-anchor="middle" font-family="Mono, monospace" font-size="9" fill="#4a5a7a">(replace)</text>
      </g>
      
      <!-- Name -->
      <text x="0" y="85" text-anchor="middle" class="text-main" font-family="Display, sans-serif" 
            font-size="22" font-weight="700">HUX</text>
      <text x="0" y="110" text-anchor="middle" class="text-muted" font-size="10">Harsh Sharma</text>
      
      <!-- Role -->
      <text x="0" y="135" text-anchor="middle" class="text-accent" font-family="Mono, monospace" 
            font-size="11" font-weight="600">CMO & CO-FOUNDER</text>
      <text x="0" y="152" text-anchor="middle" class="text-muted" font-size="10">InfluenzO Technologies</text>
      
      <!-- Divider -->
      <line x1="-80" y1="165" x2="80" y2="165" stroke="#1e2a3e" stroke-width="1"/>
      
      <!-- Verified metrics -->
      <g transform="translate(0, 180)" font-family="Mono, monospace" font-size="10">
        <text x="-100" y="0" class="text-main" font-weight="600">VERIFIED</text>
        <text x="-100" y="18" class="text-muted" font-size="9">NVIDIA Inception</text>
        <text x="-100" y="32" class="text-muted" font-size="9">IIT Delhi Blueprint</text>
        <text x="-100" y="46" class="text-muted" font-size="9">IIT Guwahati UDGAM Finalist</text>
        <text x="-100" y="60" class="text-muted" font-size="9">2 Govt Startup Grants</text>
        <text x="-100" y="74" class="text-muted" font-size="9">MeitY GENESIS Support</text>
        <text x="-100" y="88" class="text-muted" font-size="9">Punjab Startup Ecosystem</text>
      </g>
      
      <!-- Barcode -->
      <g transform="translate(-70, 290)">
        <rect class="barcode-line" x="0" y="0" width="2" height="40"/>
        <rect class="barcode-line" x="4" y="0" width="1" height="40"/>
        <rect class="barcode-line" x="6" y="0" width="3" height="40"/>
        <rect class="barcode-line" x="10" y="0" width="1" height="40"/>
        <rect class="barcode-line" x="12" y="0" width="2" height="40"/>
        <rect class="barcode-line" x="16" y="0" width="4" height="40"/>
        <rect class="barcode-line" x="21" y="0" width="1" height="40"/>
        <rect class="barcode-line" x="24" y="0" width="3" height="40"/>
        <rect class="barcode-line" x="28" y="0" width="2" height="40"/>
        <rect class="barcode-line" x="31" y="0" width="1" height="40"/>
        <rect class="barcode-line" x="34" y="0" width="4" height="40"/>
        <rect class="barcode-line" x="39" y="0" width="2" height="40"/>
        <text x="20" y="55" text-anchor="middle" class="text-muted" font-size="8">HUX-2026-INFLUENZO</text>
      </g>
      
      <!-- Bottom foil strip -->
      <rect class="foil" x="-120" y="200" width="240" height="6" rx="0 0 12 12"/>
      
      <!-- Light sweep animation -->
      <rect x="-120" y="-80" width="240" height="360" fill="url(#lightSweep)" opacity="0">
        <animate attributeName="opacity" values="0;0.4;0" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="x" values="-360;400" dur="3s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
  
  <!-- Pendulum swing animation -->
  <animateTransform 
    href="#idCard"
    attributeName="transform"
    type="rotate"
    from="-1.7 200 100"
    to="1.7 200 100"
    dur="2.4s"
    repeatCount="indefinite"
    keyTimes="0;0.5;1"
    values="-1.7 200 100;1.7 200 100;-1.7 200 100"
    calcMode="spline"
    keySplines="0.4 0 0.6 1;0.4 0 0.6 1"
  />
  
  <!-- Initial drop animation -->
  <animateTransform
    href="#idCard"
    attributeName="transform"
    type="translate"
    from="0 -200"
    to="0 0"
    dur="1.2s"
    begin="0s"
    fill="freeze"
    calcMode="spline"
    keySplines="0.34 1.56 0.64 1"
  />
  
  <!-- Reduced motion fallback -->
  <style>
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
      #idCard { transform: translate(200, 100) rotate(0deg) !important; }
    }
  </style>
</svg>